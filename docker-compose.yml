services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vyroh-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://vyroh_user:vyroh_secure_pass@db:5432/vyroh_db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-vyroh_super_secret_auth_key_replace_in_prod}
      - BETTER_AUTH_URL=${APP_URL:-http://localhost:3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_CONNECT_CLIENT_ID=${STRIPE_CONNECT_CLIENT_ID}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vyroh-network

  db:
    image: pgvector/pgvector:pg16
    container_name: vyroh-postgres
    restart: always
    environment:
      POSTGRES_USER: vyroh_user
      POSTGRES_PASSWORD: vyroh_secure_pass
      POSTGRES_DB: vyroh_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./drizzle/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyroh_user -d vyroh_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vyroh-network

  caddy:
    image: caddy:2-alpine
    container_name: vyroh-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - vyroh-network

networks:
  vyroh-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
